
# The Site Configuration

# Theme
theme: jekyll-theme-chirpy

# Language and timezone
lang: en
timezone: Africa/Cairo

# Site identity
title: "Asmaa Salah | OwL 🦉🖤"
tagline: "Cybersecurity | Networking | Cloud Security"
description: >-
  Asmaa Salah's cybersecurity portfolio and technical blog,
  featuring hands-on projects, penetration testing labs,
  network security, AWS cloud security, and technical writeups.

url: "https://asmaa588.github.io"
baseurl: ""

# GitHub profile
github:
  username: asmaa588

# Twitter profile (optional)
twitter:
  username:

# Author and social links
social:
  name: "Asmaa Salah | OwL 🦉🖤"
  email: "asmaasalh3424@gmail.com"
  fediverse_handle:
  links:
        - https://github.com/asmaa588
        - https://www.linkedin.com/in/asmaa-salah-6144a32a4
        - https://medium.com/@owl30

# Search engine verification
webmaster_verifications:
  google:
  bing:
  alexa:
  yandex:
  baidu:
  facebook:

# Analytics (optional)
analytics:
  google:
    id:
  goatcounter:
    id:
  umami:
    id:
    domain:
  matomo:
    id:
    domain:
  cloudflare:
    id:
  fathom:
    id:

# Page views
pageviews:
  provider:

# Default appearance
theme_mode: dark

# CDN
cdn:

# Sidebar avatar
avatar:

# Social preview image
social_preview_image:

# Table of contents
toc: true

# Post editing links
actions:
  edit_post:
    enabled: false
    url: ""
    static_url: false

# Comments
comments:
  provider:
  disqus:
    shortname:
  utterances:
    repo:
    issue_term:
  giscus:
    repo:
    repo_id:
    category:
    category_id:
    mapping:
    strict:
    input_position:
    lang:
    reactions_enabled:

# Optional self-hosted assets
assets:
  self_host:
    enabled:
    env:

# Progressive Web App
pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

# Pagination
paginate: 10

# Markdown and syntax highlighting
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Collections
collections:
  tabs:
    output: true
    sort_by: order

# Default layouts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/

  - scope:
      path: _drafts
    values:
      comments: false

  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

# CSS
sass:
  style: compressed

# HTML compression
compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs:
      - development

# Excluded files
exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

# Categories and tags archive URLs
jekyll-archives:
  enabled:
    - categories
    - tags
  layouts:
    category: category
    tag: tag
  permalinks:
    category: /categories/:name/
    tag: /tags/:name/
